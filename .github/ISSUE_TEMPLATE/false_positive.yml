name: False positive or false negative
description: A rule fired on a change that did not weaken anything, or missed one that did
labels: ['rule-accuracy']
body:
  - type: markdown
    attributes:
      value: |
        Rule accuracy is the thing this project is judged on, so these reports
        are worth a lot. Please include the patch — a rule is a pure function of
        the diff, so the diff is the whole reproduction.

  - type: dropdown
    id: kind
    attributes:
      label: Which is it
      options:
        - False positive — it fired and nothing was weakened
        - False negative — something was weakened and it stayed quiet
    validations:
      required: true

  - type: input
    id: rule
    attributes:
      label: Rule ID
      description: For a false negative, the rule you would have expected to fire.
      placeholder: 'ASSERTION_WEAKENED'
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: overlock version
      placeholder: '0.5.0'
    validations:
      required: true

  - type: textarea
    id: patch
    attributes:
      label: The patch
      description: Reduced to the smallest diff that still shows the behaviour.
      render: diff
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why the result is wrong
      description: >-
        For a false positive, what the change actually did. For a false
        negative, what the test can no longer catch.
    validations:
      required: true
