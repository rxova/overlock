name: Setup pnpm
description: Install pnpm (version from the packageManager field) and Node.js with pnpm caching.

# pnpm/action-setup reads `packageManager` from package.json itself, so the pnpm
# version is pinned in exactly one place. An empty registry-url is ignored, which
# is what lets one step cover both the ordinary and the publishing case.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '24'
  registry-url:
    description: >-
      npm registry to configure auth against. Only the publishing job needs this —
      it is what writes the .npmrc that Trusted Publishing authenticates with.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm

    - name: Report versions
      shell: bash
      run: |
        node --version
        pnpm --version
