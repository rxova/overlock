version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One consolidated PR per week instead of a stream of single-dependency ones.
    open-pull-requests-limit: 1
    # `skip-changeset` is what the changeset gate reads. A bump changes what the
    # repository builds with, never what it publishes, so there is no changelog
    # entry to write — and a gate that demanded one anyway would be answered with
    # an empty changeset every week, which is how a gate stops meaning anything.
    labels: ['dependencies', 'skip-changeset']
    # `chore(deps): …`, as the history already has it.
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR rather than one per package: this repo has no runtime
      # dependencies, so every bump here is dev tooling and reviewing them
      # individually is noise.
      dev-tooling:
        applies-to: version-updates
        patterns: ['*']
      # Security fixes are grouped too, so an advisory batch is also one PR.
      dev-tooling-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # TypeScript 7 is held, not skipped. One part of the toolchain refuses it,
      # and it is not this repository's code — `tsc --noEmit` passes clean under
      # it today:
      #
      #   - typescript-eslint declares its peer as `>=4.8.4 <6.1.0` and errors on
      #     sight of TS 7. That is the whole `lint` job.
      #     https://github.com/typescript-eslint/typescript-eslint/issues/10940
      #
      # The second blocker is gone: tsup's declaration build crashed on TS 7
      # because its bundled `rollup-plugin-dts` was built against TS 5.7, and the
      # build now runs on tsdown, whose declaration build does not.
      #
      # Without this, Dependabot offers the same unmergeable bump every week and
      # the group it belongs to goes red with it, which is how a weekly red pull
      # request stops being read at all.
      #
      # Lift it — delete this entry — once typescript-eslint accepts TS 7. Check
      # by bumping typescript by hand and running `pnpm run verify`; nothing else
      # here needs to change, because the code is already ready for it.
      - dependency-name: typescript
        versions: ['>=7.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels: ['dependencies', 'skip-changeset']
    commit-message:
      prefix: chore
      include: scope
    groups:
      all-actions:
        applies-to: version-updates
        patterns: ['*']
      all-actions-security:
        applies-to: security-updates
        patterns: ['*']
