name: CI

# Every job but e2e, dogfood and the published-action check is a reusable
# workflow from rxova/shared, called at @main. What stays here is the graph:
# which jobs run, and when. The steps are the ones `pnpm run verify` runs.

on:
  push:
    branches: [main]
  pull_request:
    # Deliberately no `edited`. It fires on body edits as well as title edits and
    # nothing at the trigger can tell them apart, so a description gaining a link
    # re-ran this graph — which, because the re-run skipped every heavy job,
    # republished those names as `skipped` over verdicts that were already green.
    # The title check moved to pr-title.yml, where the same edit costs one job
    # under a name nothing requires.
    #
    # `labeled`/`unlabeled` stay: the changeset gate's escape hatch is a label,
    # and without them the label lands on a pull request whose checks never
    # re-run. They run the full graph like any other event — a label is rare,
    # and a run that skips its way to a verdict is what this file is now
    # arranged to avoid.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# One lane per ref. On main nothing is cancelled at all. A push there is the last chance to judge
# that commit: it is already merged, and the release commit that follows skips
# the matrix precisely because it trusts its parent's verdict. Cancelling a main
# run means the next push silently erases the only signal the commit under it
# would ever get, and the first thing to notice is a red Release after the
# publish window has already been missed. Superseded pull request runs stay
# cancellable — the branch will be judged again on its next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  commitlint:
    name: commit messages
    uses: rxova/shared/.github/workflows/commit-messages.yml@main

  # The docs site is left out of the build: docs.yml builds it at the base path
  # rxova.dev mounts it on, the only build of it whose output ships.
  checks:
    name: lint · format · types · build
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/repo-checks.yml@main
    with:
      build-command: pnpm exec turbo run build --filter='!@overlock/docs'
      # The repository scripts are a root task, outside the packages' typecheck.
      extra-command: pnpm run check:llms && pnpm exec turbo run //#typecheck:scripts

  test:
    name: unit
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/unit-tests.yml@main
    with:
      # The shared default, named so the suite's invocation stays visible here.
      test-command: pnpm test
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # `engines` promises Node 20.11 while everything else runs on .nvmrc. Not the
  # shared node-floor-smoke.yml: its pack smoke also `require()`s the package,
  # which Node 20.11 cannot do for an ESM-only one. The probe packs the tarball,
  # installs it as a consumer would, loads the library entry and runs the CLI
  # against a real repository, all on the floor.
  compat:
    name: published package on node 20
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: rxova/shared/actions/setup-pnpm@main
      - uses: rxova/shared/actions/turbo-cache@main
        with:
          key: compat
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=overlock
      - name: Switch to Node 20.11
        uses: actions/setup-node@v7
        with:
          node-version: "20.11"
      - name: Install the tarball and run it as a consumer would
        run: bash scripts/node-floor-probe.sh

  e2e:
    name: e2e (real git repositories)
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The suite spawns git and reads its output. Path separators, line
        # endings and the shell all differ on Windows, and this is the only
        # suite that would notice.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: rxova/shared/actions/setup-pnpm@main
      - uses: rxova/shared/actions/turbo-cache@main
        with:
          key: e2e-${{ matrix.os }}
      - run: pnpm install --frozen-lockfile
      - name: Configure git for the fixtures
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: End-to-end
        run: pnpm run e2e

  supply-chain:
    name: audit · sherif · knip · dedupe
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/supply-chain.yml@main

  pack-smoke:
    name: package contract
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/package-contract.yml@main

  dogfood:
    name: overlock on itself
    needs: [commitlint]
    if: github.event_name == 'pull_request' && needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The action posts a single findings comment, edited in place.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: rxova/shared/actions/setup-pnpm@main
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build
      # A tool that gates other people's test edits has no business exempting
      # its own — and running it through the action rather than the binary means
      # the action is exercised on every pull request too. `cli-path` points at
      # this branch's build, so the gate is the code under review rather than
      # the last release.
      - name: Check this branch's own patch
        uses: ./
        with:
          cli-path: ${{ github.workspace }}/packages/overlock/dist/cli.js

  published-action:
    name: the published action
    needs: [commitlint]
    if: github.event_name == 'pull_request' && needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `dogfood` gates the patch with the working tree; this checks the ref a
      # consumer uses still resolves and runs. `@v0` because that is the tag the
      # README hands out and the one a bad release breaks.
      - name: Run overlock as a consumer would
        uses: rxova/overlock@v0
        with:
          # `dogfood` owns the verdict and the comment.
          comment: "false"
          fail-on: none

  docs-checks:
    name: docs checks
    needs: [commitlint]
    if: needs.commitlint.outputs.docs-only == 'true'
    uses: rxova/shared/.github/workflows/docs-checks.yml@main
    with:
      command: pnpm run format:check

  changeset:
    name: changeset present
    needs: [commitlint]
    uses: rxova/shared/.github/workflows/changeset-gate.yml@main

  # The one context branch protection requires. `skipped` passes; `failure`
  # and `cancelled` do not.
  gate:
    name: all checks
    if: always()
    needs:
      - commitlint
      - checks
      - test
      - compat
      - e2e
      - supply-chain
      - pack-smoke
      - dogfood
      - published-action
      - docs-checks
      - changeset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: rxova/shared/actions/require-jobs@main
        with:
          needs: ${{ toJSON(needs) }}
