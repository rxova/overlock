name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` matters because the PR title becomes the squash-merge subject and
    # nothing else validates it. `labeled`/`unlabeled` matter because the
    # changeset gate's escape hatch is a label, and without them the label lands
    # on a PR whose checks never re-run.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

# Two lanes per ref. The three metadata-only actions move no file, so they must
# not cancel a full run already in flight for the same commit and restart the
# whole graph from zero.
#
# On main nothing is cancelled at all. A push there is the last chance to judge
# that commit: it is already merged, and the release commit that follows skips
# the matrix precisely because it trusts its parent's verdict. Cancelling a main
# run means the next push silently erases the only signal the commit under it
# would ever get, and the first thing to notice is a red Release after the
# publish window has already been missed. Superseded pull request runs stay
# cancellable — the branch will be judged again on its next push.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    contains(fromJSON('["edited", "labeled", "unlabeled"]'), github.event.action)
    && 'metadata' || 'code' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The root of the graph: everything else declares `needs: [commitlint]`. It
  # runs on push as well as pull_request on purpose — a skipped job skips its
  # dependents, so gating this on pull_request alone would silently skip the
  # entire workflow on main.
  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Every job that reads the tree is gated on this. A title edit or a label
      # change leaves HEAD where it was, so re-running lint, types and tests
      # would recompute a verdict this commit already carries. GitHub counts a
      # job skipped by `if:` as satisfying a required check, which a trigger
      # filter would not.
      code-changed: >-
        ${{ steps.event-scope.outputs.metadata-only == 'true'
        && 'false' || steps.scope.outputs.code-changed }}
    steps:
      # Recognised without a checkout, so a title edit or a label costs one
      # short job rather than a clone and an install.
      - name: Decide whether this event could have touched the tree
        id: event-scope
        env:
          ACTION: ${{ github.event.action }}
        run: |
          case "$ACTION" in
            edited | labeled | unlabeled) echo 'metadata-only=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'metadata-only=false' >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile

      # The release commit bumps a version, writes a changelog and consumes the
      # changesets, leaving the source tree identical to a parent CI already
      # proved green. Re-running the matrix on it re-derives a verdict that
      # commit already carries. Recognised by its file set, never by its branch
      # name or its subject line.
      - name: Decide whether this commit touched the tree
        id: scope
        if: steps.event-scope.outputs.metadata-only != 'true'
        env:
          BASE_SHA: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.sha || github.sha }}
        run: node --import tsx ./packages/tooling/check-scope.ts

      - name: Lint the branch commits
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      # Read the title live from the API rather than out of `github.event`: an
      # edit no longer cancels the run in flight, so two runs can publish this
      # check at once and the payload one could affirm a title the edit has since
      # broken. Piped, never interpolated — a PR title is attacker-controlled text.
      - name: Lint the PR title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title \
            | pnpm exec commitlint --verbose

      - name: Lint the pushed commit
        if: github.event_name == 'push'
        run: pnpm exec commitlint --last --verbose

  checks:
    name: lint · format · types · build
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Build
        run: pnpm exec turbo run build
      - name: Typecheck
        run: pnpm exec turbo run typecheck

  test:
    name: unit (node ${{ matrix.node-version }})
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The package supports Node >= 20.11; pnpm 11 needs >= 22.13 to install,
        # so 20 is exercised by the compatibility job below instead.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node-version }}
      # Turbo hashes files and env, not the Node binary, and the cache action
      # keys on `github.job` — one string for every leg of a matrix. Naming the
      # partition after the leg keeps node 24 from replaying a node 22 result.
      - uses: ./.github/actions/turbo-cache
        with:
          key: unit-node${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      - name: Test with coverage thresholds
        run: pnpm test

  # `engines.node` claims >=20.11 for the published package, and until this job
  # existed nothing checked it: the dev toolchain needs pnpm 11, which itself
  # needs >=22.13, so every other job runs on 22 or 24 and the claim went
  # untested. This packs on 24 and then runs the tarball under 20, which is the
  # only thing the claim is actually about.
  compat:
    name: published package on node 20
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
        with:
          key: compat
      - run: pnpm install --frozen-lockfile
      # `npm pack --workspace` reads npm's own `workspaces` field from the root
      # manifest. This is a pnpm workspace, so npm sees none and the job failed
      # before it checked anything — which is how the engines claim stayed
      # unverified while a green-looking job sat next to it. Packing from inside
      # the package needs no workspace support at all.
      - name: Build and pack
        run: pnpm exec turbo run build
      # `--pack-destination` does not create the directory it is handed; npm
      # opens the tarball for writing and fails with ENOENT if it is missing.
      - name: Pack the tarball
        working-directory: packages/overlock
        run: |
          mkdir -p /tmp/pkg
          npm pack --pack-destination /tmp/pkg

      - name: Switch to Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20.11'

      - name: Install the tarball and run it as a consumer would
        run: |
          node --version
          mkdir -p /tmp/consumer && cd /tmp/consumer
          echo '{"name":"consumer","private":true,"type":"module"}' > package.json
          npm install --no-audit --no-fund /tmp/pkg/*.tgz
          npx --no-install overlock --version
          # A count would have to be edited here every time a rule is added, and
          # it fails as "rule registry changed shape" — which is what adding a
          # rule is. pack:smoke holds the tarball to the source registry exactly;
          # this job's question is whether the entry loads on the oldest Node
          # this package supports and exports a registry at all.
          node -e "import('overlock').then(m => {
            const r = m.analyze({ diff: '' });
            if (r.findings.length !== 0) throw new Error('empty diff produced findings');
            if (!Array.isArray(m.RULE_IDS) || m.RULE_IDS.length === 0) throw new Error('rule registry missing');
            if (!m.RULE_IDS.includes('TEST_SKIPPED_ADDED')) throw new Error('rule registry changed shape');
            console.log('library entry loads on node 20');
          })"

      - name: Check it against a real repository on node 20
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          git init -q --initial-branch=main .
          git config user.email ci@example.com && git config user.name CI
          mkdir -p src && printf 'export const check = () => true;\n' > src/a.ts
          git add -A && git commit -q -m "init"
          printf "it.skip('x', () => {});\n" > src/a.test.ts
          set +e
          /tmp/consumer/node_modules/.bin/overlock check --base auto --no-ledger
          status=$?
          set -e
          test "$status" -eq 1 || { echo "expected exit 1, got $status"; exit 1; }

  e2e:
    name: e2e (real git repositories)
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The suite spawns git and reads its output. Path separators, line
        # endings and the shell all differ on Windows, and this is the only
        # suite that would notice.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
        with:
          key: e2e-${{ matrix.os }}
      - run: pnpm install --frozen-lockfile
      - name: Configure git for the fixtures
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: End-to-end
        run: pnpm run e2e

  supply-chain:
    name: audit · dedupe
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      # `audit:check` is deliberately not a Turbo task: its verdict depends on
      # the upstream advisory database, which changes without any file here
      # changing, so a cached pass could replay over a fresh CVE.
      #
      # `--ignore-registry-errors` keeps an unreachable advisory endpoint from
      # failing the job: pnpm exits 0 when the registry was at fault and leaves
      # every other failure alone. How long it waits first is bounded by
      # `fetchTimeout` / `fetchRetries` in pnpm-workspace.yaml; `timeout-minutes`
      # is the backstop for pnpm not coming back at all.
      - name: Audit dependencies
        timeout-minutes: 5
        run: pnpm run audit:check
      - name: Check dependency dedupe
        run: pnpm run dedupe:check

  pack-smoke:
    name: package contract
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      - name: Publint and Are The Types Wrong
        run: pnpm run check:exports
      # Before the tarball, so a drifted llms.txt is reported as itself rather
      # than as a missing file inside pack-smoke's output.
      - name: Check llms.txt
        run: pnpm run check:llms
      # Packs the real tarball and runs the published bin out of it. The only
      # check that catches a `files` entry that dropped dist.
      - name: Pack smoke test
        run: pnpm run pack:smoke

  dogfood:
    name: overlock on itself
    needs: [commitlint]
    if: github.event_name == 'pull_request' && needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The action posts a single findings comment, edited in place.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build
      # A tool that gates other people's test edits has no business exempting
      # its own — and running it through the action rather than the binary means
      # the action is exercised on every pull request too. `cli-path` points at
      # this branch's build, so the gate is the code under review rather than
      # the last release.
      - name: Check this branch's own patch
        uses: ./
        with:
          cli-path: ${{ github.workspace }}/packages/overlock/dist/cli.js

  changeset:
    name: changeset present
    needs: [commitlint]
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require a changeset when the published package changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The job still runs and still reports, rather than being skipped by an
          # `if:`, so that honouring the label is visible in a log somebody can read.
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node --import tsx ./packages/tooling/check-changeset.ts

  # The single context branch protection requires, and the only job here that
  # never skips.
  #
  # Requiring the job names directly does not work. Two runs can report on one
  # commit — a push publishes the real verdicts, then an `edited` or a label
  # publishes the metadata lane, where every heavy job is skipped by its `if:`
  # and reports a second check run under the same name. Both instances count as
  # required, a skipped one never satisfies the requirement, and the pull
  # request sits blocked behind checks whose rollup reads green. The matrix jobs
  # hide it further: skipped before expansion, they report under the literal
  # `unit (node ${{ matrix.node-version }})`, so their names drift with the
  # event that produced them.
  #
  # One always-reported context sidesteps all of it. `skipped` is the answer
  # this workflow gives deliberately — a metadata event, a release commit — so
  # the gate accepts it. `cancelled` is not: a run killed mid-flight is the
  # verdict this repository has already once mistaken for a pass.
  gate:
    name: all checks
    if: always()
    needs:
      - commitlint
      - checks
      - test
      - compat
      - e2e
      - supply-chain
      - pack-smoke
      - dogfood
      - changeset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed or skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          bad=$(echo "$RESULTS" | jq -r 'to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"))
            | .[] | "\(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::a required job did not pass"
            echo "$bad"
            exit 1
          fi
          echo "every job passed or was deliberately skipped"
