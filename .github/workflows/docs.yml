name: Docs

# The docs are published as part of rxova.dev (the rxova/rxova-website
# aggregator), not from this repository. The aggregator does not build them:
# this workflow builds the dist for /packages/overlock/, uploads it as the
# `docs-dist` artifact, and dispatches a `docs` event naming this run — gate 1
# of the contract in rxova/rxova-website docs/INPUTS-CONTRACT.md. rxova.dev
# validates what arrives, persists it and republishes; a rejection leaves the
# live site untouched.
#
# Requires the AGGREGATOR_DISPATCH_TOKEN secret (a fine-grained PAT with
# Contents: write on rxova/rxova-website).

on:
  push:
    branches: [main]
  # Docs breakage should fail the pull request that causes it, not the
  # aggregator deploy that ships it — a red rxova.dev build blocks every project
  # on the site.
  pull_request:
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# `cancel-in-progress` on pull requests only, and the distinction is
# load-bearing. Superseding a docs build for a branch still under review only
# saves a build nobody will read. On main the same run is also the publish —
# `notify-website` below hands rxova.dev this run's artifact — so cancelling one
# mid-flight risks the site keeping stale docs if the run that replaced it then
# fails. Queueing is the right behaviour there.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: rxova/shared/actions/setup-pnpm@main
      - uses: rxova/shared/actions/turbo-cache@main
      - run: pnpm install --frozen-lockfile

      # Build at the path the aggregator actually serves these docs from.
      # Absolute references that only work at the domain root are invisible in a
      # root build and break silently once mounted. The build also runs
      # starlight-links-validator and `rxova-docs-kit check-md-routes`, so a broken
      # internal link or an untwinned page fails here.
      - name: Build the docs at the aggregator base path
        env:
          DOCS_URL: https://rxova.dev
          DOCS_BASE_URL: /packages/overlock/
        run: pnpm --filter @overlock/docs build

      # The dist rxova.dev publishes as built. `docs-dist` is the
      # fixed artifact name in the contract — the aggregator's ingest downloads
      # it by that name from this run — so it is not ours to rename. Pointing
      # `path` at the dist directory rather than its parent is what puts
      # index.html at the artifact root, which is the aggregator's gate 2b.
      #
      # Uploaded on pull requests too: the artifact is then the reviewable
      # output of the check, and an empty dist fails here rather than at ingest.
      - name: Upload docs-dist
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/docs/dist
          if-no-files-found: error

  # Gate 1 of the docs pipeline: tell rxova.dev that this run holds a dist built
  # for /packages/overlock/. The aggregator validates the payload, downloads the
  # artifact above, and persists and publishes it — it never builds these docs
  # itself. Contract: rxova/rxova-website docs/INPUTS-CONTRACT.md.
  notify-website:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No continue-on-error: the dispatch *is* the publish, so swallowing a
      # failure would leave the site serving stale docs behind a green tick.
      - name: Dispatch the docs ingest to rxova.dev
        uses: rxova/shared/actions/notify-website@main
        with:
          project: overlock
          token: ${{ secrets.AGGREGATOR_DISPATCH_TOKEN }}
