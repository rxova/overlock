name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Trusted Publishing to npm: no long-lived token in repository secrets.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile

      # Everything CI runs, before anything is published. A release that skipped
      # the gates is the one release that most needed them.
      - name: Verify
        run: pnpm run verify

      - name: Create a version PR, or publish one that was merged
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
