name: Release

# Runs only after CI has gone green on main, so nothing publishes that a pull
# request would have been blocked on. The versioning and the publish are the
# shared changesets-release workflow from rxova/shared: it opens a
# `chore: version packages` pull request, and publishes with npm trusted
# publishing (OIDC, provenance) once that pull request is merged.
#
# This file keeps its name on purpose: the npm trusted publisher for `overlock`
# is registered against `release.yml`, and a reusable workflow publishes under
# the name of the workflow that calls it.
#
# What stays here is what only this repository needs. overlock is also a GitHub
# Action, consumed as `rxova/overlock@v0` and listed on the Marketplace from a
# `vX.Y.Z` release, and neither of those is something changesets knows about.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # workflow_run fires on failure as well, so the conclusion is checked.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write # version commit and tags
      pull-requests: write # the version pull request
      id-token: write # npm trusted publishing (OIDC), with provenance
    uses: rxova/shared/.github/workflows/changesets-release.yml@main
    with:
      # Everything CI runs, once more on the commit being published. The shared
      # workflow checks out main by name, which can be a later commit than the
      # one CI judged.
      run-verify: true
      # The action's `vX.Y.Z` release below is the only GitHub release: a second
      # `overlock@X.Y.Z` one per version would sit beside it on the releases
      # page. The `overlock@X.Y.Z` tag is still pushed, because action-tags
      # reads it.
      create-github-releases: false

  # The action half of this repository. Runs only when the release above
  # published, and reads the commit to tag from the `overlock@<version>` tag
  # changesets just wrote, so it names the published commit even if main has
  # moved since.
  action-tags:
    name: tag and release the action
    needs: [release]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The Marketplace lists an action from a *release*, and validates the tag
      # behind it as semver — `overlock@0.5.1`, the only tag changesets writes in
      # a monorepo, is not one, so it can never carry a listing. The action
      # therefore needs a `vX.Y.Z` tag of its own naming the same commit.
      #
      # The two version lines can drift: `action.yml` alone can be released as
      # the action, and take a `v<version>` npm has not reached yet. So this can
      # find its own tag already present on a different commit, and the tempting
      # answer — skip, the release exists — is the dangerous one: the tag would
      # name code from before this publish and the listing would quietly stop
      # updating. Better to fail and be told to pick a version that is free.
      - name: Tag and release the action
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ needs.release.outputs.published-packages }}
        run: |
          set -euo pipefail
          version=$(echo "$PUBLISHED" | jq -r '.[] | select(.name == "overlock") | .version')
          case "$version" in
            ''|null)
              echo "::error::could not read overlock's version from publishedPackages: $PUBLISHED"
              exit 1
              ;;
          esac

          git fetch --tags --force origin
          sha=$(git rev-list -n 1 "overlock@$version")
          tag="v$version"
          tagged=$(git rev-list -n 1 "$tag" 2>/dev/null || true)

          if [ -n "$tagged" ] && [ "$tagged" != "$sha" ]; then
            echo "::error::$tag already names $tagged, but this release is $sha."
            echo "::error::The action was released at $version before npm reached it."
            echo "::error::Bump past it with a changeset, then re-run: a version tag is not moved."
            exit 1
          fi

          # Not forced, and only when it is missing: a version tag names one
          # release for good. An equal `tagged` is this same publish re-run.
          if [ -z "$tagged" ]; then
            git tag "$tag" "$sha"
            git push origin "$tag"
          fi

          # `rxova/overlock@v0` is a *moving* major tag by GitHub Actions
          # convention. Read from the published version, so the first 1.0.0
          # starts writing `v1` without anyone coming back here.
          major=${version%%.*}
          echo "pointing v$major at $sha"
          git tag -f "v$major" "$sha"
          git push -f origin "v$major"

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi

          # The changelog entry changesets just wrote, rather than a generated
          # list of commit subjects: it is the one written for a reader.
          notes="$RUNNER_TEMP/notes.md"
          git show "$sha:packages/overlock/CHANGELOG.md" | awk -v v="## $version" '
            $0 == v { collecting = 1; next }
            collecting && /^## / { exit }
            collecting { print }
          ' > "$notes"
          [ -s "$notes" ] || echo "See packages/overlock/CHANGELOG.md." > "$notes"

          # `--latest`: the Marketplace listing follows the latest release, which
          # has to be this semver one.
          gh release create "$tag" --target "$sha" --title "$tag" --notes-file "$notes" --latest

  # Every step above hangs on one output of a third-party action, and when that
  # output once silently went false the release published to npm and tagged
  # nothing — green. So the last word belongs to the registry: if the version in
  # the tree is on npm, the tags naming it have to exist. On a run that
  # published nothing they already do, and this says nothing.
  #
  # When this run did publish, "not on npm yet" is not an answer. npm has taken
  # over thirty minutes to serve a version after `changeset publish` returned,
  # and a check that passed during that lag verified nothing. So it waits for
  # the registry, within a bound, and a version that never appears is a failure.
  # Not `rxova-repo-config post-publish-smoke`: its wait is fixed at ten minutes,
  # which that lag outlasts.
  tags-present:
    name: published versions are tagged
    needs: [release, action-tags]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    # The 45-minute registry wait below, plus a checkout and a fetch.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Fail if a published version has no tags
        env:
          PUBLISHED: ${{ needs.release.outputs.published }}
          PUBLISHED_PACKAGES: ${{ needs.release.outputs.published-packages }}
          # Seconds. Long enough for the worst lag seen, short of the job timeout.
          REGISTRY_WAIT: "2700"
        run: |
          set -euo pipefail

          served() {
            [ "$(npm view "overlock@$1" version --prefer-online 2> /dev/null || true)" = "$1" ]
          }

          if [ "$PUBLISHED" = "true" ]; then
            # The version changesets reported, not the tree's: main can have
            # moved on since, and it is this publish that has to be tagged.
            version=$(echo "$PUBLISHED_PACKAGES" | jq -r '.[] | select(.name == "overlock") | .version')
            case "$version" in
              ''|null)
                echo "::error::this run published, but not overlock: $PUBLISHED_PACKAGES"
                exit 1
                ;;
            esac

            # 15 s, doubling to a 2-minute ceiling: quick when npm is quick,
            # and about 25 requests across the whole window when it is not.
            waited=0
            delay=15
            until served "$version"; do
              if [ "$waited" -ge "$REGISTRY_WAIT" ]; then
                echo "::error::changesets published overlock@$version, but npm still does not serve it after ${waited}s."
                echo "::error::Check the npm package page before re-running: a publish that never landed needs a new version."
                exit 1
              fi
              echo "npm does not serve overlock@$version yet; checking again in ${delay}s (${waited}s so far)"
              sleep "$delay"
              waited=$((waited + delay))
              delay=$((delay * 2 > 120 ? 120 : delay * 2))
            done
          else
            version=$(node -p "require('./packages/overlock/package.json').version")
            if ! served "$version"; then
              echo "overlock@$version is not on npm and this run published nothing; nothing to tag."
              exit 0
            fi
          fi

          git fetch --tags --force origin
          missing=
          for tag in "overlock@$version" "v$version"; do
            git rev-parse -q --verify "refs/tags/$tag" > /dev/null || missing="$missing $tag"
          done

          if [ -n "$missing" ]; then
            echo "::error::overlock@$version is published, but these tags are missing:$missing"
            echo "::error::The release is half done: npm has it and this repository cannot point at it."
            exit 1
          fi

          echo "overlock@$version is published and tagged."
