name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      # Trusted Publishing to npm: no long-lived token in repository secrets.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile

      # Everything CI runs, before anything is published. A release that skipped
      # the gates is the one release that most needed them.
      - name: Verify
        run: pnpm run verify

      # v2, not v1. v1 predates Changesets v3 and cannot read its publish
      # output: 0.6.1 went to npm under v1 while `published` came back false, so
      # every tagging step below skipped and the job still went green. The
      # release list, the `v0` tag and the Marketplace all stayed on 0.6.0.
      #
      # Tags come from the steps below rather than from the action, so that the
      # `v<version>` the Marketplace needs and the `overlock@<version>` the
      # package uses are written in one place.
      - name: Create a version PR, or publish one that was merged
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm exec changeset version
          publish-script: pnpm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: false
          push-git-tags: false
        env:
          # Not for the action, which takes its token as an input: for
          # `@changesets/changelog-github`, which reads this to write the
          # changelog entries and refuses to run without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `changeset publish` ends at "Created git tags" — it writes them into the
      # runner's clone and nothing pushes them. 0.5.0 and 0.5.1 both reached npm
      # with no tag behind them and had to be backfilled by hand, which is how a
      # published version stops being findable in this repository at all.
      #
      # Pushed here rather than left to the action, so it does not depend on the
      # action parsing its own publish output to decide whether to bother.
      - name: Push the version tags
        if: steps.changesets.outputs.published == 'true'
        run: git push origin --tags

      # The action half of this repository is consumed as `rxova/overlock@v0`,
      # and by GitHub Actions convention that is a *moving* major tag: consumers
      # pin the major and expect it to follow releases. Left alone it keeps
      # naming whatever commit it was first pointed at, so every consumer stays
      # frozen there while npm moves on.
      #
      # The major is read from the published version rather than hardcoded, so
      # the first 1.0.0 release starts writing `v1` without anyone remembering to
      # come back here.
      - name: Move the action's major tag
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs['published-packages'] }}
        run: |
          set -euo pipefail
          major=$(echo "$PUBLISHED" | jq -r '.[0].version' | cut -d. -f1)
          case "$major" in
            ''|*[!0-9]*)
              echo "::error::could not read a major version from publishedPackages: $PUBLISHED"
              exit 1
              ;;
          esac
          echo "pointing v$major at $GITHUB_SHA"
          git tag -f "v$major" "$GITHUB_SHA"
          git push -f origin "v$major"

      # The Marketplace lists an action from a *release*, and validates the tag
      # behind it as semver — `overlock@0.5.1`, which is the only tag changesets
      # writes in a monorepo, is not one, so it can never carry a listing. The
      # action therefore needs a `vX.Y.Z` tag of its own alongside the package's,
      # naming the same commit.
      #
      # This is also what makes a new version show up on the listing at all:
      # after the first manual publish, GitHub updates the Marketplace entry from
      # each subsequent release, and a release is exactly what this repository
      # was not producing.
      - name: Tag and release the action
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs['published-packages'] }}
        run: |
          set -euo pipefail
          version=$(echo "$PUBLISHED" | jq -r '.[0].version')
          case "$version" in
            ''|null)
              echo "::error::could not read a version from publishedPackages: $PUBLISHED"
              exit 1
              ;;
          esac

          tag="v$version"

          # The two version lines can drift. Only `packages/` reaches npm, so a
          # change to `action.yml` alone — a Marketplace fix, say — is released
          # as the action and nothing else, and takes a `v<version>` npm has not
          # reached yet. `v0.6.0` was cut that way while npm stayed on `0.5.1`.
          #
          # Which means this step can find its own tag already present, on a
          # different commit, and the tempting answer — skip, the release exists
          # — is the dangerous one: the tag would then name code from before this
          # publish, the Marketplace listing would quietly stop updating, and
          # nothing anywhere would say so. Better to fail the release and be
          # told to pick a version that is free.
          git fetch --tags --force origin
          tagged=$(git rev-list -n 1 "$tag" 2>/dev/null || true)

          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$tag already names $tagged, but this release is $GITHUB_SHA."
            echo "::error::The action was released at $version before npm reached it."
            echo "::error::Bump past it with a changeset, then re-run: a version tag is not moved."
            exit 1
          fi

          # Not forced, and only when it is missing: a version tag names one
          # release for good, and quietly moving it is how a consumer who pinned
          # it ends up running code they never chose. An equal `tagged` is this
          # same publish being re-run, which is allowed to finish.
          if [ -z "$tagged" ]; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi

          # The changelog entry changesets just wrote, rather than a generated
          # list of commit subjects: it is the one written for a reader.
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="## $version" '
            $0 == v { collecting = 1; next }
            collecting && /^## / { exit }
            collecting { print }
          ' packages/overlock/CHANGELOG.md > "$notes"
          [ -s "$notes" ] || echo "See packages/overlock/CHANGELOG.md." > "$notes"

          gh release create "$tag" --title "$tag" --notes-file "$notes"

      # Every step above hangs on one output of a third-party action, and when
      # that output silently went false the release published to npm and tagged
      # nothing — green. So the last word belongs to the registry, not to the
      # output: if the version in the tree is on npm, the tags naming it have to
      # exist. On a run that published nothing they already do, and this says
      # nothing.
      - name: Fail if a published version has no tags
        if: always() && steps.changesets.outcome == 'success'
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/overlock/package.json').version")

          if ! npm view "overlock@$version" version > /dev/null 2>&1; then
            echo "overlock@$version is not on npm; nothing to tag."
            exit 0
          fi

          git fetch --tags --force origin
          missing=
          for tag in "overlock@$version" "v$version"; do
            git rev-parse -q --verify "refs/tags/$tag" > /dev/null || missing="$missing $tag"
          done

          if [ -n "$missing" ]; then
            echo "::error::overlock@$version is published, but these tags are missing:$missing"
            echo "::error::The release is half done: npm has it and this repository cannot point at it."
            exit 1
          fi

          echo "overlock@$version is published and tagged."
