name: Release

# Runs only after CI has gone green on main, so nothing publishes that a pull
# request would have been blocked on. The versioning and the publish are the
# shared changesets-release workflow from rxova/shared: it opens a
# `chore: version packages` pull request, and publishes with npm trusted
# publishing (OIDC, provenance) once that pull request is merged.
#
# This file keeps its name on purpose: the npm trusted publisher for `overlock`
# is registered against `release.yml`, and a reusable workflow publishes under
# the name of the workflow that calls it.
#
# What stays here is what only this repository needs. overlock is also a GitHub
# Action, consumed as `rxova/overlock@v0` and listed on the Marketplace from a
# `vX.Y.Z` release, and neither of those is something changesets knows about.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # workflow_run fires on failure as well, so the conclusion is checked.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write # version commit and tags
      pull-requests: write # the version pull request
      id-token: write # npm trusted publishing (OIDC), with provenance
    uses: rxova/shared/.github/workflows/changesets-release.yml@main
    with:
      # Everything CI runs, once more on the commit being published. The shared
      # workflow checks out main by name, which can be a later commit than the
      # one CI judged.
      run-verify: true
      # The action's `vX.Y.Z` release below is the only GitHub release: a second
      # `overlock@X.Y.Z` one per version would sit beside it on the releases
      # page. The `overlock@X.Y.Z` tag is still pushed, because action-tags
      # reads it.
      create-github-releases: false

  # The action half of this repository: a `vX.Y.Z` tag and release for the
  # Marketplace, and the moving `vMAJOR` tag consumers pin. Runs only when the
  # release above published. The logic is scripts/release/tag-action.ts.
  action-tags:
    name: tag and release the action
    needs: [release]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: rxova/shared/actions/setup-pnpm@main
      - name: Tag and release the action
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ needs.release.outputs.published-packages }}
        run: node scripts/release/tag-action-cli.ts

  # The registry has the last word: if npm serves the version in the tree, the
  # tags naming it must exist. The logic is scripts/release/check-tags.ts.
  tags-present:
    name: published versions are tagged
    needs: [release, action-tags]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: rxova/shared/actions/setup-pnpm@main
      - name: Fail if a published version has no tags
        run: node scripts/release/check-tags-cli.ts
