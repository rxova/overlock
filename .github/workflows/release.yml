name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      # Trusted Publishing to npm: no long-lived token in repository secrets.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile

      # Everything CI runs, before anything is published. A release that skipped
      # the gates is the one release that most needed them.
      - name: Verify
        run: pnpm run verify

      - name: Create a version PR, or publish one that was merged
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `changeset publish` ends at "Created git tags" — it writes them into the
      # runner's clone and nothing pushes them. 0.5.0 and 0.5.1 both reached npm
      # with no tag behind them and had to be backfilled by hand, which is how a
      # published version stops being findable in this repository at all.
      #
      # Pushed here rather than left to the action, so it does not depend on the
      # action parsing its own publish output to decide whether to bother.
      - name: Push the version tags
        if: steps.changesets.outputs.published == 'true'
        run: git push origin --tags

      # The action half of this repository is consumed as `rxova/overlock@v0`,
      # and by GitHub Actions convention that is a *moving* major tag: consumers
      # pin the major and expect it to follow releases. Left alone it keeps
      # naming whatever commit it was first pointed at, so every consumer stays
      # frozen there while npm moves on.
      #
      # The major is read from the published version rather than hardcoded, so
      # the first 1.0.0 release starts writing `v1` without anyone remembering to
      # come back here.
      - name: Move the action's major tag
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          major=$(echo "$PUBLISHED" | jq -r '.[0].version' | cut -d. -f1)
          case "$major" in
            ''|*[!0-9]*)
              echo "::error::could not read a major version from publishedPackages: $PUBLISHED"
              exit 1
              ;;
          esac
          echo "pointing v$major at $GITHUB_SHA"
          git tag -f "v$major" "$GITHUB_SHA"
          git push -f origin "v$major"
