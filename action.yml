name: overlock
description: Find out what a coding agent did to your tests — a deterministic gate on test integrity in a patch.
author: Jonatan Kruszewski

branding:
  icon: scissors
  color: green

inputs:
  base:
    description: >-
      Git ref to diff against, read as the fork point with it. Defaults to the
      pull request's base commit; on a push, to whatever overlock.config.json
      says, and otherwise to "auto" (uncommitted work if any, otherwise this
      branch's commits).
    required: false
    default: ''
  fail-on:
    description: >-
      Severity at or above which the job fails: high, medium, low or none.
      Left empty, overlock.config.json decides, and failing that, high.
    required: false
    default: ''
  comment:
    description: >-
      Post the findings as a single pull request comment, updated in place on
      later runs rather than added to. Needs `pull-requests: write`.
    required: false
    default: 'true'
  severity:
    description: >-
      Per-rule severity overrides, one `RULE_ID=level` per line. Lets a
      repository that deletes test files routinely grade TEST_REMOVED down
      without dropping fail-on globally and disarming every other rule.
    required: false
    default: ''
  working-directory:
    description: Directory to run in.
    required: false
    default: '.'
  version:
    description: >-
      Version of overlock to run. Pinning an exact version lets the runner's npm
      cache hit; "latest" has to ask the registry what that means on every run.
    required: false
    default: 'latest'
  cli-path:
    description: >-
      Path to an already-built CLI, used instead of fetching from npm. This
      repository's own dogfood job sets it so overlock gates its pull requests
      with the code in the branch rather than the last release.
    required: false
    default: ''
  github-token:
    description: Token used to post the comment.
    required: false
    default: ${{ github.token }}

outputs:
  ok:
    description: '"true" when nothing at or above fail-on was found.'
    value: ${{ steps.check.outputs.ok }}
  findings:
    description: Number of findings reported.
    value: ${{ steps.check.outputs.findings }}
  report:
    description: Path to the JSON report.
    value: ${{ steps.check.outputs.report }}
  fail-on:
    description: The severity threshold the run actually applied.
    value: ${{ steps.check.outputs.fail-on }}

runs:
  using: composite
  steps:
    # A pull request is the case worth getting right: `github.sha` on a PR is the
    # merge commit, so diffing against it reports nothing. The base commit is
    # what makes the diff mean "this branch's work".
    - name: Work out what to diff against
      id: range
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        # Empty on a push, deliberately: the flag is then left off entirely so
        # that overlock.config.json can name the base. Passing "auto" here would
        # be the action answering a question the repository already answered,
        # which is exactly the drift the config file exists to end.
        if [ -n "$INPUT_BASE" ]; then
          echo "base=$INPUT_BASE" >> "$GITHUB_OUTPUT"
        elif [ -n "$PR_BASE_SHA" ]; then
          echo "base=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
        else
          echo "base=" >> "$GITHUB_OUTPUT"
        fi

    - name: Run overlock
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE: ${{ steps.range.outputs.base }}
        FAIL_ON: ${{ inputs.fail-on }}
        SEVERITY: ${{ inputs.severity }}
        PR_BODY: ${{ github.event.pull_request.body }}
        VERSION: ${{ inputs.version }}
        CLI_PATH: ${{ inputs.cli-path }}
      run: |
        set -o pipefail

        # Resolved once, then invoked as a local file.
        #
        # `npx -y overlock@latest` re-resolves the package against the registry
        # on every call, and this step calls the CLI twice — once for the JSON
        # report and once for the human-readable log. That is two downloads per
        # job, each of which is a network round trip that can take minutes when
        # the registry is slow, for a tool whose own analysis finishes in
        # seconds. Installing once and running `node` twice makes the second
        # invocation free.
        if [ -n "$CLI_PATH" ]; then
          cli="$CLI_PATH"
        else
          echo "::group::Install overlock@$VERSION"
          install_dir="$RUNNER_TEMP/overlock-cli"
          mkdir -p "$install_dir"
          # --prefer-offline reuses the runner's npm cache when it has the
          # tarball; --no-audit and --no-fund drop two registry calls that
          # nothing here reads.
          npm install --prefix "$install_dir" --no-save --no-audit --no-fund \
            --prefer-offline --loglevel error "overlock@$VERSION"
          # The bin path is read from the installed package rather than
          # hardcoded, so a future change to the package layout does not
          # silently break the action.
          cli=$(INSTALL_DIR="$install_dir" node -e '
            const { join, dirname } = require("node:path");
            const manifest = require.resolve("overlock/package.json", {
              paths: [process.env.INSTALL_DIR],
            });
            const { bin } = require(manifest);
            const entry = typeof bin === "string" ? bin : bin.overlock;
            process.stdout.write(join(dirname(manifest), entry));
          ')
          echo "using $cli"
          echo "::endgroup::"
        fi

        run_overlock() { node "$cli" "$@"; }

        report="$RUNNER_TEMP/overlock-report.json"

        # `Overlock-Allow:` trailers are read from the commits in the range, and
        # from the pull request body — which is where a reviewer of a six
        # hundred file rename is actually looking. Through a file rather than an
        # argument: the body is written by whoever opened the pull request.
        allow="$RUNNER_TEMP/overlock-allow.txt"
        printf '%s\n' "$PR_BODY" > "$allow"

        # One --severity flag per non-empty line. Built as an array rather than
        # a string so a value containing whitespace stays one argument, and with
        # an `if` rather than an `&&` list: `shell: bash` runs with -e, so a
        # trailing AND-list that evaluates false on the empty input would abort
        # the step for everyone who does not set this input.
        severity_args=()
        while IFS= read -r line; do
          if [ -n "$line" ]; then
            severity_args+=(--severity "$line")
          fi
        done <<< "$SEVERITY"

        # An unset input adds no flag, so the repository's own config is what
        # answers. A set one wins, because someone typed it into the workflow.
        base_args=()
        if [ -n "$BASE" ]; then base_args+=(--base "$BASE"); fi
        fail_args=()
        if [ -n "$FAIL_ON" ]; then fail_args+=(--fail-on "$FAIL_ON"); fi

        # Said out loud, once, so a surprising verdict starts with the base it
        # was reached from rather than with a bisect.
        echo "::group::overlock settings"
        run_overlock config "${base_args[@]}" "${fail_args[@]}" "${severity_args[@]}" || true
        echo "::endgroup::"

        # The ledger is a record of what a person's agents did on their machine.
        # A CI runner is neither, and it is thrown away, so nothing is written.
        set +e
        run_overlock check "${base_args[@]}" "${fail_args[@]}" "${severity_args[@]}" \
          --allow-file "$allow" --no-ledger --json > "$report"
        status=$?
        set -e

        if [ "$status" -gt 1 ]; then
          echo "::error::overlock could not run"
          cat "$report" || true
          exit "$status"
        fi

        # Through the environment rather than interpolated into the script: the
        # path is ours today, but building shell out of values is how the next
        # person's change becomes an injection.
        findings=$(REPORT="$report" node -e 'const r=require(process.env.REPORT);process.stdout.write(String(r.findings.length))')
        ok=$(REPORT="$report" node -e 'const r=require(process.env.REPORT);process.stdout.write(String(r.ok))')
        # The threshold the run actually applied, which is not necessarily this
        # action's input: overlock.config.json may have named it.
        effective_fail_on=$(REPORT="$report" node -e 'const r=require(process.env.REPORT);process.stdout.write(String(r.fail_on ?? "high"))')

        {
          echo "ok=$ok"
          echo "findings=$findings"
          echo "report=$report"
          echo "status=$status"
          echo "fail-on=$effective_fail_on"
        } >> "$GITHUB_OUTPUT"

        # The human-readable form in the log, regardless of pass or fail.
        set +e
        run_overlock check "${base_args[@]}" --fail-on none "${severity_args[@]}" \
          --allow-file "$allow" --no-ledger --explain-base
        set -e

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPORT: ${{ steps.check.outputs.report }}
        FINDINGS: ${{ steps.check.outputs.findings }}
        FAIL_ON: ${{ inputs.fail-on }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -o pipefail
        marker="<!-- overlock-report -->"
        body="$RUNNER_TEMP/overlock-comment.md"

        # The whole body is built here rather than by printf, because what the
        # comment has to say depends on which findings block: a flat table that
        # gives a blocking TEST_REMOVED the same weight as a low
        # TEST_AND_IMPL_TOGETHER makes a reviewer do the sorting the tool
        # already knows how to do.
        MARKER="$marker" node -e '
          const report = require(process.env.REPORT);
          // Rule and path come from the diff, so on any pull request they are
          // chosen by whoever opened it. A backtick closes the code span and a
          // newline ends the row and starts one the attacker writes. Both are
          // stripped rather than escaped: neither belongs in either field.
          const cell = (value) =>
            String(value)
              .replace(/[\u0000-\u001F\u007F\u0060]/g, "")
              .replace(/\|/g, "\\|")
              .slice(0, 200);

          const rank = { high: 0, medium: 1, low: 2 };
          // From the run, not from whatever default this action would assume:
          // the threshold may have come from overlock.config.json, and naming a
          // different one here is worse than naming none at all.
          const failOn = report.fail_on || process.env.FAIL_ON || "high";
          const blocks = (f) => failOn !== "none" && rank[f.severity] <= (rank[failOn] ?? 0);
          // A finding with no line is about the file itself — a deleted test
          // file has no line 1 to send anyone to.
          const where = (f) =>
            f.line == null ? cell(f.file) : cell(f.file) + ":" + (Number(f.line) || 0);
          const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");
          const verb = (n, one, many) => (n === 1 ? one : many);

          const out = [process.env.MARKER, ""];
          const findings = report.findings || [];

          if (findings.length === 0) {
            out.push("**overlock**: nothing weakened in this patch.");
          } else {
            // A rename is the patch, not a finding about it. Said first, and
            // said as a claim: the number that matters is how much of this
            // patch it does *not* account for.
            const explained = findings.filter((f) => f.explained_by !== undefined);
            const rest = findings.filter((f) => f.explained_by === undefined);
            for (const rename of report.renames || []) {
              const casings = rename.casings === 1 ? "" : ", " + rename.casings + " casings";
              out.push(
                "**rename detected** — `" + cell(rename.from) + "` to `" + cell(rename.to) +
                  "` (" + rename.files + " files" + casings + "). " +
                  explained.length + verb(explained.length, " finding is", " findings are") +
                  " consistent with it; " + rest.length + verb(rest.length, " is", " are") +
                  " not.",
                "",
              );
            }

            const blocking = rest.filter(blocks);
            const context = rest.filter((f) => !blocks(f));

            const verdict =
              blocking.length > 0
                ? plural(blocking.length, "finding") +
                  verb(blocking.length, " blocks", " block") + " this merge" +
                  (context.length > 0
                    ? "; " + context.length + " more " +
                      verb(context.length, "is", "are") + " context."
                    : ".")
                : "nothing blocks this merge; " + plural(context.length, "finding") +
                  " worth a look.";
            out.push("**overlock** — " + verdict, "");

            if (blocking.length > 0) {
              out.push("| Severity | Rule | Where | What |", "| --- | --- | --- | --- |");
              for (const f of blocking) {
                out.push(
                  "| " + cell(f.severity) + " | `" + cell(f.rule) + "` | `" + where(f) +
                    "` | " + cell(f.message) + " |",
                );
              }
              out.push("");
            }

            // Collapsed, and grouped by rule: TEST_AND_IMPL_TOGETHER firing
            // once per file is noise at any patch size above trivial, and six
            // identical rows say nothing the count does not.
            if (context.length > 0) {
              const groups = new Map();
              for (const f of context) {
                const key = f.severity + " " + f.rule;
                if (!groups.has(key)) groups.set(key, { severity: f.severity, rule: f.rule, files: [] });
                const group = groups.get(key);
                if (!group.files.includes(f.file)) group.files.push(f.file);
              }

              out.push(
                "<details><summary>" + plural(context.length, "finding") +
                  verb(context.length, " that does not block", " that do not block") +
                  "</summary>",
                "",
                "| Severity | Rule | Count | Where |",
                "| --- | --- | --- | --- |",
              );
              for (const g of groups.values()) {
                const shown = g.files.slice(0, 3).map((f) => "`" + cell(f) + "`").join(", ");
                const rest = g.files.length - Math.min(g.files.length, 3);
                out.push(
                  "| " + cell(g.severity) + " | `" + cell(g.rule) + "` | " + g.files.length +
                    " | " + shown + (rest > 0 ? ", and " + rest + " more" : "") + " |",
                );
              }
              out.push("", "</details>", "");
            }

            if (explained.length > 0 && (report.renames || []).length === 0) {
              out.push(
                plural(explained.length, "further finding") +
                  verb(explained.length, " is", " are") + " accounted for by reformatting.",
                "",
              );
            }

            out.push(
              "Silence one deliberately with `// overlock-ignore RULE_ID -- reason`, or " +
                "`// overlock-ignore RULE_ID <path> -- reason` for a finding with no line " +
                "of its own. Acknowledge a whole patch with an `Overlock-Allow: RULE_ID -- " +
                "reason` trailer in this description or a commit message.",
            );
          }

          process.stdout.write(out.join("\n") + "\n");
        ' > "$body"

        # One comment, edited in place. A bot that appends on every push buries
        # the review it is supposed to support.
        existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
          --jq "map(select(.body | startswith(\"$marker\"))) | first | .id // empty")

        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$body" > /dev/null
        else
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$body" > /dev/null
        fi

    - name: Fail if the gate did not pass
      if: ${{ steps.check.outputs.status != '0' }}
      shell: bash
      # `${{ }}` expressions are pasted into the script before bash sees it, so
      # they belong in env even when the values are ones this action computed.
      env:
        FINDINGS: ${{ steps.check.outputs.findings }}
        FAIL_ON: ${{ steps.check.outputs.fail-on }}
      run: |
        echo "::error::overlock found $FINDINGS finding(s) at or above $FAIL_ON"
        exit 1
