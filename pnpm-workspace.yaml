packages:
  - packages/*
  - apps/*
overrides:
  # GHSA-g7r4-m6w7-qqqr: esbuild's development server resolves a backslash in
  # the request path on Windows, so a request can read files outside the serve
  # directory (arbitrary file read). Reached only through tsup, which builds
  # packages/overlock and pins esbuild ^0.27, both directly and via
  # bundle-require. Nothing here starts esbuild's server, it is build tooling,
  # and none of it ships: the tarball is dist/, with no runtime dependencies.
  # Scoped to the 0.27 line, the only one that resolves below the fix. tsup
  # 8.5.1 is the latest release and still asks for 0.27. 0.28's one breaking
  # change is an install-time integrity check, and the dist it builds matches
  # 0.27's. Drop this once tsup accepts 0.28.
  # The upper bound is load-bearing: esbuild 0.x minors can break, and a bare
  # floor would move tsup onto the newest minor without a review.
  esbuild@0.27: '>=0.28.1 <0.29'
allowBuilds:
  esbuild: true

# The advisory lookup is the one request whose result is advisory rather than
# required, and pnpm's default schedule -- a 60s fetch timeout and two retries --
# turns a registry outage into four minutes of waiting before it gives up. One
# retry and a short timeout is the right amount of patience for it. These are
# pnpm settings, so they belong here rather than being passed as flags at every
# call site; `.npmrc` would not do, as pnpm reads only npm-compatible settings
# such as `registry` and auth from there.
fetchTimeout: 15000
fetchRetries: 1
fetchRetryMintimeout: 5000
fetchRetryMaxtimeout: 10000
# pnpm holds back releases younger than a day, which is the right default for a
# supply chain and the wrong one for our own package: @rxova/brand is published
# from a repository next door, and waiting a day to consume a version we just cut
# only means the docs build here and the brand it renders drift for a day.
minimumReleaseAgeExclude:
  - '@rxova/brand@0.13.0'
